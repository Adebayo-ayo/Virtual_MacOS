<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacOS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="dynamic_island"></div>
      <nav>
        <div class="leftparent">
          <div class="logo"></div>
          <div class="shortcuts">
            <p></p>
            <p></p>
            <p></p>
          </div>
        </div>
        <div class="right-container">
          <p></p>
          <p></p>
          <p></p>
          <p></p>
          <p></p>
      </nav>
      <div class="hover_notification">
      <div class="notification_center">
        <div class="season">
          <div class="calender"> <img src="images/Daily_Goal.svg" alt="image"></div>
          <div class="Weather"><img src="images/Batteries 2.svg" alt="image"></div>
        </div>
        <div class="activity_monitor">
       <img src="images/TV.svg" alt="image">
        </div>
        <div class="connected_device">
         <img src="images/Music.svg" alt="image">
         <img class="monitor" src="images/activity.png" alt="image">
        </div>
        <!-- <img src="images/Weather.png" alt="image"> -->
      </div>
      </div>
      <div class="hover_bar">
        <div class="app_dock">
          <div class="app_container">
            <div class="app_content">
              <span class="app_label">First App</span>
              <div class="texts_demo">1</div>
            </div>
            <div class="texts_demo">2</div>
            <div class="texts_demo">3</div>
            <div class="texts_demo">4</div>
            <div class="texts_demo">5</div>
            <div class="texts_demo">6</div>
            <div class="texts_demo">7</div>
            <div class="texts_demo">8</div>
            <div class="texts_demo">9</div>
            <div class="texts_demo">0</div>
            <div class="texts_demo">A</div>
            <div class="texts_demo">B</div>
            <div class="texts_demo">C</div>
            <div class="texts_demo">D</div>
            <div class="texts_demo">E</div>
            <div class="texts_demo">A</div>
            <div class="texts_demo">B</div>
            <div class="texts_demo">C</div>
            <div class="texts_demo">D</div>
            <div class="texts_demo">E</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
